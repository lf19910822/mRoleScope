name: CI

on:
  pull_request:

jobs:
  backend-and-collector:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: mrolescope_ci
          POSTGRES_USER: mrolescope
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mrolescope -d mrolescope_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.5'
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: '1.27.0'
      - run: sqlc generate && git diff --exit-code -- internal/database/sqlc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - run: go test ./cmd/... ./internal/...
      - run: python3 -m unittest collector.test_collector
      - run: make deploy-config-check
      - name: Run migrations and JD analysis PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgres://mrolescope:ci-only-password@127.0.0.1:5432/mrolescope_ci?sslmode=disable
        run: |
          docker run --rm --network host -v "$PWD/migrations:/migrations:ro" migrate/migrate:v4.19.1 \
            -path=/migrations -database="$TEST_DATABASE_URL" up
          go test -p 1 ./internal/jdanalysis ./internal/jobsync -count=1
      - run: docker build --file docker/Dockerfile.worker --tag mrolescope-worker-ci:${{ github.sha }} .

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: frontend
        name: Detect checked-in frontend lockfile
        shell: bash
        run: |
          if [[ -f web/package-lock.json ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: ${{ steps.frontend.outputs.present == 'true' }}
        with:
          node-version: '20.20.2'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        if: ${{ steps.frontend.outputs.present == 'true' }}
        working-directory: web
      - run: npm run type-check
        if: ${{ steps.frontend.outputs.present == 'true' }}
        working-directory: web
      - run: npm run test:unit -- --run
        if: ${{ steps.frontend.outputs.present == 'true' }}
        working-directory: web
      - run: npm run build
        if: ${{ steps.frontend.outputs.present == 'true' }}
        working-directory: web
