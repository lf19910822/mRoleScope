name: Remote development operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Fixed remote operation to perform
        required: true
        type: choice
        options:
          - status
          - initialize-sync
          - enable-sync-timer
          - disable-sync-timer
          - backfill-versioned-content
          - run-pending-analysis
          - seed-v0.1-dictionary
          - approve-v0.1-rule
          - prepare-v0.1-analysis
          - run-v0.1-candidate-analysis
          - seed-v0.2-dictionary
          - approve-v0.2-rule
          - prepare-v0.2-analysis
          - run-v0.2-candidate-analysis
          - sync-logs
      rule_key:
        description: Required only when approving one reviewed candidate rule
        required: false
        type: string
      confirmation:
        description: For a state-changing operation, type its required phrase exactly
        required: false
        type: string

permissions: {}

jobs:
  operate:
    if: github.repository == 'lf19910822/mRoleScope' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, mrolescope-deploy]
    environment: remote-development
    concurrency:
      group: remote-development-operations
      cancel-in-progress: false
    steps:
      - name: Confirm state-changing operation
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            status|sync-logs)
              exit 0
              ;;
            initialize-sync)
              expected='RUN_INITIAL_SYNC'
              ;;
            enable-sync-timer)
              expected='ENABLE_DAILY_SYNC'
              ;;
            disable-sync-timer)
              expected='DISABLE_DAILY_SYNC'
              ;;
            backfill-versioned-content)
              expected='BACKFILL_VERSIONED_CONTENT'
              ;;
            run-pending-analysis)
              expected='RUN_PENDING_ANALYSIS'
              ;;
            seed-v0.1-dictionary)
              expected='SEED_V01_DICTIONARY'
              ;;
            approve-v0.1-rule)
              expected='APPROVE_V01_RULE'
              ;;
            prepare-v0.1-analysis)
              expected='PREPARE_V01_ANALYSIS'
              ;;
            run-v0.1-candidate-analysis)
              expected='RUN_V01_CANDIDATE_ANALYSIS'
              ;;
            seed-v0.2-dictionary)
              expected='SEED_V02_DICTIONARY'
              ;;
            approve-v0.2-rule)
              expected='APPROVE_V02_RULE'
              ;;
            prepare-v0.2-analysis)
              expected='PREPARE_V02_ANALYSIS'
              ;;
            run-v0.2-candidate-analysis)
              expected='RUN_V02_CANDIDATE_ANALYSIS'
              ;;
            *)
              echo 'Unsupported fixed operation.' >&2
              exit 1
              ;;
          esac
          if [[ "$CONFIRMATION" != "$expected" ]]; then
            echo "Confirmation must exactly equal ${expected}." >&2
            exit 1
          fi

      - name: Run root-owned fixed operation
        env:
          OPERATION: ${{ inputs.operation }}
          RULE_KEY: ${{ inputs.rule_key }}
          REVIEWER: ${{ github.actor }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            seed-v0.1-dictionary|prepare-v0.1-analysis|seed-v0.2-dictionary|prepare-v0.2-analysis)
              sudo -n /usr/local/sbin/mrolescope-operations "$OPERATION" "$REVIEWER"
              ;;
            approve-v0.1-rule|approve-v0.2-rule)
              [[ "$RULE_KEY" =~ ^[a-z0-9][a-z0-9.-]{0,127}$ ]] || {
                echo 'rule_key must be a lowercase reviewed rule key.' >&2
                exit 1
              }
              sudo -n /usr/local/sbin/mrolescope-operations "$OPERATION" "$RULE_KEY" "$REVIEWER"
              ;;
            *)
              sudo -n /usr/local/sbin/mrolescope-operations "$OPERATION"
              ;;
          esac
