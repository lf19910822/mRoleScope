name: Remote development deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    if: github.repository == 'lf19910822/mRoleScope' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: mrolescope_ci
          POSTGRES_USER: mrolescope
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mrolescope -d mrolescope_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    permissions:
      contents: read
    outputs:
      api_image: docker.io/${{ vars.DOCKERHUB_USERNAME }}/mrolescope-api@${{ steps.build_api.outputs.digest }}
      migrate_image: docker.io/${{ vars.DOCKERHUB_USERNAME }}/mrolescope-migrate@${{ steps.build_migrate.outputs.digest }}
      worker_image: docker.io/${{ vars.DOCKERHUB_USERNAME }}/mrolescope-worker@${{ steps.build_worker.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.5'
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: '1.27.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Run backend and collector tests
        run: |
          sqlc generate
          git diff --exit-code -- internal/database/sqlc
          make test
      - name: Run migrations and SCD2 PostgreSQL integration test
        env:
          TEST_DATABASE_URL: postgres://mrolescope:ci-only-password@127.0.0.1:5432/mrolescope_ci?sslmode=disable
        run: |
          docker run --rm --network host -v "$PWD/migrations:/migrations:ro" migrate/migrate:v4.19.1 \
            -path=/migrations -database="$TEST_DATABASE_URL" up
          go test -p 1 ./internal/jdanalysis ./internal/jobsync -count=1
      - name: Verify remote Compose network boundary
        run: make deploy-config-check
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('web/package-lock.json') != '' }}
        with:
          node-version: '20.20.2'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Run frontend checks
        if: ${{ hashFiles('web/package-lock.json') != '' }}
        working-directory: web
        run: |
          npm ci
          npm run type-check
          npm run test:unit -- --run
          npm run build
      - name: Verify Docker Hub deployment configuration
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          [[ "$DOCKERHUB_USERNAME" =~ ^[a-z0-9][a-z0-9_-]{0,38}$ ]] || {
            echo 'Set the non-secret repository variable DOCKERHUB_USERNAME to your lowercase Docker Hub username.' >&2
            exit 1
          }
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build_api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: docker.io/${{ vars.DOCKERHUB_USERNAME }}/mrolescope-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - id: build_migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.migrate
          push: true
          tags: docker.io/${{ vars.DOCKERHUB_USERNAME }}/mrolescope-migrate:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - id: build_worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.worker
          push: true
          tags: docker.io/${{ vars.DOCKERHUB_USERNAME }}/mrolescope-worker:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    needs: verify-and-build
    if: github.repository == 'lf19910822/mRoleScope' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, mrolescope-deploy]
    environment: remote-development
    concurrency:
      group: remote-development-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Deploy immutable images through the root-owned allowlist
        env:
          API_IMAGE: ${{ needs.verify-and-build.outputs.api_image }}
          MIGRATE_IMAGE: ${{ needs.verify-and-build.outputs.migrate_image }}
          WORKER_IMAGE: ${{ needs.verify-and-build.outputs.worker_image }}
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/mrolescope-deploy "$API_IMAGE" "$MIGRATE_IMAGE" "$WORKER_IMAGE"
