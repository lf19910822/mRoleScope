version: "2.4"

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["migrate"]
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      - "up"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    profiles: [sync]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      COS_ENDPOINT: ${COS_ENDPOINT:-}
      COS_REGION: ${COS_REGION:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_PREFIX: ${COS_PREFIX:-mrolescope}
      COS_ACCESS_KEY_ID: ${COS_ACCESS_KEY_ID:-}
      COS_SECRET_ACCESS_KEY: ${COS_SECRET_ACCESS_KEY:-}
      SYNC_TEMP_ROOT: /run/mrolescope-sync
      SYNC_TIMEOUT: ${SYNC_TIMEOUT:-45m}
      SYNC_RETRY_DELAYS: ${SYNC_RETRY_DELAYS:-15m,45m}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - type: bind
        source: ${MROLESCOPE_SYNC_HOST_DIR:-./var/sync}
        target: /run/mrolescope-sync
    networks: [default]

  analysis:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    profiles: [analysis]
    command: ["analyze"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      SYNC_TIMEOUT: ${SYNC_TIMEOUT:-45m}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    # Analysis is PostgreSQL-only: no collector task bind mount, COS
    # credentials, port, or edge-network reachability is supplied.
    networks: [default]

volumes:
  postgres_data:
