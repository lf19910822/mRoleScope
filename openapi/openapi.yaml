openapi: 3.0.3
info:
  title: MHY JD Observatory API
  version: 0.1.0
  description: |
    Anonymous read-only API for a non-official public-job observation project.
    M0 exposes service status only; domain endpoints are added after their data
    definitions and tests are accepted.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Process liveness
      responses:
        '200':
          description: Process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /readyz:
    get:
      summary: Database readiness
      responses:
        '200':
          description: Database is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '503':
          description: Database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /api/v1/jobs:
    get:
      summary: List the latest serving JD inventory
      parameters:
        - in: query
          name: title
          description: Case-insensitive title exact/substring search with a fixed typo-tolerance threshold; JD body text and synonyms are never searched.
          schema:
            type: string
        - in: query
          name: job_family
          description: Repeated unified job-family filter. A JD matches when any selected value appears in either its primary or other job-family matches. Do not combine with the legacy main_job_family or other_job_family parameters.
          schema:
            type: array
            items: {type: string}
          style: form
          explode: true
        - in: query
          name: main_job_family
          description: Legacy primary-job-family-only filter. Retained for compatible callers; do not combine with job_family.
          schema:
            type: array
            items: {type: string}
          style: form
          explode: true
        - in: query
          name: other_job_family
          description: Legacy other-job-family-only filter. Retained for compatible callers; do not combine with job_family.
          schema:
            type: array
            items: {type: string}
          style: form
          explode: true
        - in: query
          name: technology
          schema:
            type: array
            items: {type: string}
          style: form
          explode: true
        - in: query
          name: education
          schema:
            type: array
            items:
              $ref: '#/components/schemas/EducationLevel'
          style: form
          explode: true
        - in: query
          name: experience_year
          schema:
            type: array
            items: {type: integer, minimum: 1}
          style: form
          explode: true
        - in: query
          name: minimum_experience_year
          description: Optional configured minimum-work-experience threshold. Zero means an explicit requirement is available; it does not include JDs with no configured requirement.
          schema: {type: integer, minimum: 0, maximum: 9}
        - in: query
          name: project
          schema:
            type: array
            items: {type: string}
          style: form
          explode: true
        - in: query
          name: location
          schema:
            type: array
            items: {type: string}
          style: form
          explode: true
        - in: query
          name: activity_state
          schema:
            type: array
            items:
              type: string
              enum: [effective, confirmed_closed, all]
          style: form
          explode: true
        - in: query
          name: first_discovered_from
          schema: {type: string, format: date}
        - in: query
          name: first_discovered_until
          schema: {type: string, format: date}
        - in: query
          name: urgent
          schema: {type: boolean}
        - in: query
          name: page
          schema: {type: integer, minimum: 1}
        - in: query
          name: page_size
          schema: {type: integer, minimum: 1, maximum: 100}
        - in: query
          name: sort
          description: Repeated ordered scalar sort of at most four values. Earlier values have higher priority; education and experience may each occur once with unavailable values last. First-discovered date, urgent marker, activity state, and title are also supported. A single title value is retained for compatible callers and cannot be combined.
          schema:
            type: array
            maxItems: 4
            items:
              type: string
              enum: [title, education_asc, education_desc, experience_asc, experience_desc, first_discovered_asc, first_discovered_desc, urgent_asc, urgent_desc, activity_state_asc, activity_state_desc, title_asc, title_desc]
          style: form
          explode: true
      responses:
        '200':
          description: A paginated, display-safe JD list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
        '400':
          description: The submitted list request is invalid.
  /api/v1/jobs/filter-options:
    get:
      summary: List selectable structured JD filters
      responses:
        '200':
          description: Display-safe filter values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterOptionsResponse'
  /api/v1/jobs/{id}:
    get:
      summary: Read one JD by its opaque public ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Display-safe JD detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDetailResponse'
        '404':
          description: The JD is not present in the latest serving inventory.
  /api/v1/job-trends:
    get:
      summary: Read one historical JD trend curve
      description: Returns daily distinct-JD counts for one validated condition. A null count is an unavailable historical day, not zero.
      parameters:
        - in: query
          name: range
          required: true
          schema:
            type: string
            enum: [week, month, quarter, year, all]
        - in: query
          name: dimension
          required: true
          schema:
            type: string
            enum: [technology, job_family, education, project, location, experience]
        - in: query
          name: value
          required: true
          description: One current display-safe selector value for the chosen dimension.
          schema:
            type: string
        - in: query
          name: operator
          description: Required only for education and experience.
          schema:
            type: string
            enum: [eq, gt, gte, lt, lte]
        - in: query
          name: include_secondary
          description: Permitted only for job_family; true includes both primary and secondary family matches.
          schema:
            type: boolean
      responses:
        '200':
          description: A display-safe daily historical curve.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendSeries'
        '400':
          description: The submitted trend condition is invalid or incompatible.
        '503':
          description: Historical trend data is temporarily unavailable.
components:
  schemas:
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready, not_ready]
    ActivityState:
      type: string
      enum: [effective, confirmed_closed]
    EducationLevel:
      type: string
      enum: [associate_or_lower, bachelor, master, doctor]
    FilterOption:
      type: object
      required: [value, label]
      properties:
        value:
          type: string
        label:
          type: string
    TechnologyKeywordFilterOption:
      type: object
      required: [value, label, category]
      properties:
        value:
          type: string
        label:
          type: string
        category:
          $ref: '#/components/schemas/FilterOption'
    EducationRequirement:
      type: object
      required: [explicit_requirement]
      properties:
        explicit_requirement:
          type: boolean
        lower_bound:
          $ref: '#/components/schemas/EducationLevel'
        upper_bound:
          $ref: '#/components/schemas/EducationLevel'
    ExperienceRequirement:
      type: object
      required: [explicit_requirement]
      properties:
        explicit_requirement:
          type: boolean
        minimum_years:
          type: integer
          minimum: 1
    TrendCurve:
      type: object
      required: [dimension, label, value]
      properties:
        dimension:
          type: string
          enum: [technology, job_family, education, project, location, experience]
        include_secondary:
          type: boolean
        label:
          type: string
        operator:
          type: string
          enum: [eq, gt, gte, lt, lte]
        value:
          type: string
    TrendPoint:
      type: object
      required: [date, count]
      properties:
        date:
          type: string
          format: date
        count:
          type: integer
          minimum: 0
          nullable: true
          description: Null means unavailable historical input; zero means a complete snapshot with no matching JD.
    TrendSeries:
      type: object
      required: [curve, points, freshness]
      properties:
        curve:
          $ref: '#/components/schemas/TrendCurve'
        points:
          type: array
          items:
            $ref: '#/components/schemas/TrendPoint'
        freshness:
          type: string
          description: Opaque safe freshness marker.
    JobListItem:
      type: object
      required:
        [id, title, locations, activity_state, first_discovered_date, is_urgent,
         other_job_families, technology_keywords, projects]
      properties:
        id:
          type: string
          description: Opaque public JD ID.
        title:
          type: string
        locations:
          type: array
          items:
            type: string
        activity_state:
          $ref: '#/components/schemas/ActivityState'
        first_discovered_date:
          type: string
          format: date
        is_urgent:
          type: boolean
        main_job_family:
          $ref: '#/components/schemas/FilterOption'
        other_job_families:
          type: array
          items:
            $ref: '#/components/schemas/FilterOption'
        technology_keywords:
          type: array
          items:
            $ref: '#/components/schemas/FilterOption'
        education:
          $ref: '#/components/schemas/EducationRequirement'
        experience:
          $ref: '#/components/schemas/ExperienceRequirement'
        projects:
          type: array
          items:
            $ref: '#/components/schemas/FilterOption'
    JobListResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/JobListItem'
        page:
          $ref: '#/components/schemas/PageInfo'
    BodySections:
      type: object
      required: [responsibilities, requirements]
      properties:
        responsibilities:
          type: string
        requirements:
          type: string
        supplemental:
          type: string
        technology_highlights:
          type: array
          items:
            $ref: '#/components/schemas/TechnologyHighlight'
    TechnologyHighlight:
      type: object
      description: Display-safe Unicode code-point interval for a technology mention in the returned current JD body.
      required: [section, start, end]
      properties:
        section:
          type: string
          enum: [responsibilities, requirements, supplemental]
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 1
    JobDetailResponse:
      allOf:
        - $ref: '#/components/schemas/JobListItem'
        - type: object
          required: [body]
          properties:
            body:
              $ref: '#/components/schemas/BodySections'
    FilterOptionsResponse:
      type: object
      required:
        [activity_states, job_families, main_job_families, other_job_families, technology_keywords,
         education_levels, experience_years, projects, locations, urgent_options]
      properties:
        activity_states:
          type: array
          items:
            $ref: '#/components/schemas/FilterOption'
        job_families:
          type: array
          description: Deduplicated unified vocabulary covering primary and other family hits.
          items:
            $ref: '#/components/schemas/FilterOption'
        main_job_families:
          type: array
          items:
            $ref: '#/components/schemas/FilterOption'
        other_job_families:
          type: array
          items:
            $ref: '#/components/schemas/FilterOption'
        technology_keywords:
          type: array
          items:
            $ref: '#/components/schemas/TechnologyKeywordFilterOption'
        education_levels:
          type: array
          items:
            $ref: '#/components/schemas/FilterOption'
        experience_years:
          type: array
          items:
            $ref: '#/components/schemas/FilterOption'
        projects:
          type: array
          items:
            $ref: '#/components/schemas/FilterOption'
        locations:
          type: array
          items:
            $ref: '#/components/schemas/FilterOption'
        urgent_options:
          type: array
          items:
            $ref: '#/components/schemas/FilterOption'
    PageInfo:
      type: object
      required: [number, page_size, total]
      properties:
        number:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
