services:
  postgres:
    image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]

  migrate:
    image: ${MROLESCOPE_MIGRATE_IMAGE}
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command:
      - "-path=/migrations"
      - "-database=${DATABASE_URL}"
      - up
    networks: [backend]

  api:
    image: ${MROLESCOPE_API_IMAGE}
    restart: unless-stopped
    environment:
      APP_ENV: remote-development
      HTTP_ADDR: ":8080"
      DATABASE_URL: ${DATABASE_URL}
      COLLECTOR_TIMEOUT: "15m"
      ARCHIVE_LOCAL_DIR: /var/lib/mrolescope/archives
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    networks: [backend, edge]

  worker:
    image: ${MROLESCOPE_WORKER_IMAGE}
    profiles: [sync]
    restart: "no"
    environment:
      APP_ENV: remote-development
      DATABASE_URL: ${DATABASE_URL}
      COLLECTOR_TIMEOUT: "15m"
      SYNC_TIMEOUT: ${SYNC_TIMEOUT:-45m}
      SYNC_RETRY_DELAYS: ${SYNC_RETRY_DELAYS:-15m,45m}
      SYNC_TEMP_ROOT: /run/mrolescope-sync
      COS_ENDPOINT: ${COS_ENDPOINT:-}
      COS_REGION: ${COS_REGION:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_PREFIX: ${COS_PREFIX:-mrolescope}
      COS_ACCESS_KEY_ID: ${COS_ACCESS_KEY_ID:-}
      COS_SECRET_ACCESS_KEY: ${COS_SECRET_ACCESS_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - type: bind
        source: ${MROLESCOPE_SYNC_HOST_DIR:-/run/mrolescope-sync-not-configured}
        target: /run/mrolescope-sync
    # No port is published. edge supplies outbound HTTPS for the source and COS;
    # PostgreSQL remains reachable only on the internal backend network.
    networks: [backend, edge]

  analysis:
    image: ${MROLESCOPE_WORKER_IMAGE}
    profiles: [analysis]
    restart: "no"
    command: ["analyze"]
    environment:
      APP_ENV: remote-development
      DATABASE_URL: ${DATABASE_URL}
      SYNC_TIMEOUT: ${SYNC_TIMEOUT:-45m}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    # This one-shot consumer reads only the database's normalized JD versions.
    # It has no port, no raw-data bind mount, no COS credentials, and no edge
    # network path to the source or object storage.
    networks: [backend]

  candidate-analysis:
    image: ${MROLESCOPE_WORKER_IMAGE}
    profiles: [candidate-analysis]
    restart: "no"
    command: ["analyze-candidate-v0.1"]
    environment:
      APP_ENV: remote-development
      DATABASE_URL: ${DATABASE_URL}
      SYNC_TIMEOUT: ${SYNC_TIMEOUT:-45m}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    # Candidate analysis reads PostgreSQL only and must remain separate from
    # the normal published-configuration analysis service.
    networks: [backend]

  candidate-analysis-v0.2:
    image: ${MROLESCOPE_WORKER_IMAGE}
    profiles: [candidate-analysis-v0.2]
    restart: "no"
    command: ["analyze-candidate-v0.2"]
    environment:
      APP_ENV: remote-development
      DATABASE_URL: ${DATABASE_URL}
      SYNC_TIMEOUT: ${SYNC_TIMEOUT:-45m}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    # This version-specific candidate remains isolated from published analysis,
    # source collection, object storage, and host-mounted raw data.
    networks: [backend]

  analysis-release-v0.2:
    image: ${MROLESCOPE_WORKER_IMAGE}
    profiles: [release-v0.2]
    restart: "no"
    command: ["release-v0.2", "publish"]
    environment:
      APP_ENV: remote-development
      DATABASE_URL: ${DATABASE_URL}
      SYNC_TIMEOUT: ${SYNC_TIMEOUT:-45m}
      MROLESCOPE_RELEASE_PUBLISHER: ${MROLESCOPE_RELEASE_PUBLISHER:-}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    # The release gate operates only on remote PostgreSQL facts. It never has
    # a source/COS path, raw-data mount, external network, or host port.
    networks: [backend]

  analysis-withdraw-v0.2-quality:
    image: ${MROLESCOPE_WORKER_IMAGE}
    profiles: [release-v0.2]
    restart: "no"
    command: ["release-v0.2", "withdraw-quality"]
    environment:
      APP_ENV: remote-development
      DATABASE_URL: ${DATABASE_URL}
      SYNC_TIMEOUT: ${SYNC_TIMEOUT:-45m}
      MROLESCOPE_RELEASE_PUBLISHER: ${MROLESCOPE_RELEASE_PUBLISHER:-}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    networks: [backend]

  analysis-withdraw-v0.2-security:
    image: ${MROLESCOPE_WORKER_IMAGE}
    profiles: [release-v0.2]
    restart: "no"
    command: ["release-v0.2", "withdraw-security"]
    environment:
      APP_ENV: remote-development
      DATABASE_URL: ${DATABASE_URL}
      SYNC_TIMEOUT: ${SYNC_TIMEOUT:-45m}
      MROLESCOPE_RELEASE_PUBLISHER: ${MROLESCOPE_RELEASE_PUBLISHER:-}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    networks: [backend]

  dictionary-seed:
    image: ${MROLESCOPE_WORKER_IMAGE}
    profiles: [dictionary]
    restart: "no"
    command: ["dictionary-v0.1", "seed", "${MROLESCOPE_DICTIONARY_OPERATOR:-}"]
    environment:
      APP_ENV: remote-development
      DATABASE_URL: ${DATABASE_URL}
      SYNC_TIMEOUT: ${SYNC_TIMEOUT:-45m}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    networks: [backend]

  dictionary-approve:
    image: ${MROLESCOPE_WORKER_IMAGE}
    profiles: [dictionary]
    restart: "no"
    command: ["dictionary-v0.1", "approve", "${MROLESCOPE_DICTIONARY_RULE_KEY:-}", "${MROLESCOPE_DICTIONARY_OPERATOR:-}"]
    environment:
      APP_ENV: remote-development
      DATABASE_URL: ${DATABASE_URL}
      SYNC_TIMEOUT: ${SYNC_TIMEOUT:-45m}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    networks: [backend]

  dictionary-prepare:
    image: ${MROLESCOPE_WORKER_IMAGE}
    profiles: [dictionary]
    restart: "no"
    command: ["dictionary-v0.1", "prepare-analysis", "${MROLESCOPE_DICTIONARY_OPERATOR:-}"]
    environment:
      APP_ENV: remote-development
      DATABASE_URL: ${DATABASE_URL}
      SYNC_TIMEOUT: ${SYNC_TIMEOUT:-45m}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    networks: [backend]

  dictionary-v0.2-seed:
    image: ${MROLESCOPE_WORKER_IMAGE}
    profiles: [dictionary]
    restart: "no"
    command: ["dictionary-v0.2", "seed", "${MROLESCOPE_DICTIONARY_OPERATOR:-}"]
    environment:
      APP_ENV: remote-development
      DATABASE_URL: ${DATABASE_URL}
      SYNC_TIMEOUT: ${SYNC_TIMEOUT:-45m}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    networks: [backend]

  dictionary-v0.2-approve:
    image: ${MROLESCOPE_WORKER_IMAGE}
    profiles: [dictionary]
    restart: "no"
    command: ["dictionary-v0.2", "approve", "${MROLESCOPE_DICTIONARY_RULE_KEY:-}", "${MROLESCOPE_DICTIONARY_OPERATOR:-}"]
    environment:
      APP_ENV: remote-development
      DATABASE_URL: ${DATABASE_URL}
      SYNC_TIMEOUT: ${SYNC_TIMEOUT:-45m}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    networks: [backend]

  dictionary-v0.2-approve-reviewed:
    image: ${MROLESCOPE_WORKER_IMAGE}
    profiles: [dictionary]
    restart: "no"
    command: ["dictionary-v0.2", "approve-reviewed", "${MROLESCOPE_DICTIONARY_OPERATOR:-}"]
    environment:
      APP_ENV: remote-development
      DATABASE_URL: ${DATABASE_URL}
      SYNC_TIMEOUT: ${SYNC_TIMEOUT:-45m}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    networks: [backend]

  dictionary-v0.2-prepare:
    image: ${MROLESCOPE_WORKER_IMAGE}
    profiles: [dictionary]
    restart: "no"
    command: ["dictionary-v0.2", "prepare-analysis", "${MROLESCOPE_DICTIONARY_OPERATOR:-}"]
    environment:
      APP_ENV: remote-development
      DATABASE_URL: ${DATABASE_URL}
      SYNC_TIMEOUT: ${SYNC_TIMEOUT:-45m}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    networks: [backend]

  backfill:
    image: ${MROLESCOPE_WORKER_IMAGE}
    profiles: [backfill]
    restart: "no"
    command: ["backfill-versioned-content"]
    environment:
      APP_ENV: remote-development
      DATABASE_URL: ${DATABASE_URL}
      SYNC_TIMEOUT: ${SYNC_TIMEOUT:-45m}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    # The baseline conversion only reads published rows from PostgreSQL. It has
    # no port, raw-data mount, COS credentials, or edge-network route.
    networks: [backend]

networks:
  backend:
    internal: true
  edge: {}

volumes:
  postgres_data:
