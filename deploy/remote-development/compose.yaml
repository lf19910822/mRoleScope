version: "2.4"

services:
  postgres:
    image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]

  migrate:
    image: ${MROLESCOPE_MIGRATE_IMAGE}
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command:
      - "-path=/migrations"
      - "-database=${DATABASE_URL}"
      - up
    networks: [backend]

  api:
    image: ${MROLESCOPE_API_IMAGE}
    restart: unless-stopped
    environment:
      APP_ENV: remote-development
      HTTP_ADDR: ":8080"
      DATABASE_URL: ${DATABASE_URL}
      COLLECTOR_TIMEOUT: "15m"
      ARCHIVE_LOCAL_DIR: /var/lib/mrolescope/archives
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    networks: [backend, edge]

networks:
  backend:
    internal: true
  edge: {}

volumes:
  postgres_data:
