<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>进入 mRoleScope</title>
    <link rel="stylesheet" href="/access/access.css" />
  </head>
  <body>
    <main class="access-shell">
      <section class="access-card" aria-labelledby="access-title">
        <div class="access-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <p class="access-kicker">mRoleScope · JD OBSERVATORY</p>
        <h1 id="access-title">输入邀请码，开始体验</h1>
        <p class="access-description">验证通过后，可访问岗位筛选、岗位详情、岗位历史和趋势看板。</p>
        <form id="access-form" novalidate>
          <label for="invite-code">邀请码</label>
          <input id="invite-code" name="invite_code" type="password" autocomplete="off" required autofocus />
          <p id="access-feedback" class="access-feedback" role="status" aria-live="polite"></p>
          <button type="submit">进入网站</button>
        </form>
        <p class="access-note">邀请码验证后将在本设备保持 3 天。</p>
      </section>
    </main>
    <script src="/access/access.js" defer></script>
  </body>
</html>
